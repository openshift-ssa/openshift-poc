          - RHEL VM with Apache httpd: workloads-and-operations/virtual-machine-workloads/rhel-httpd-vm.md
          - Virtual Appliances (OVA): workloads-and-operations/virtual-machine-workloads/ova-virtual-appliance.md
      - Operational Validation:
          - workloads-and-operations/operational-validation/index.md
          - VM Failover Test: workloads-and-operations/operational-validation/vm-failover.md
          - Container Failover Test: workloads-and-operations/operational-validation/container-failover.md
          - VM Backup and Restore: workloads-and-operations/operational-validation/vm-backup-restore.md
      - Day-2 Operations:
