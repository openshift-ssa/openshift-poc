site_name: OpenShift POC
site_description: Prerequisites and installation instructions for OpenShift on-premise environments
site_url: https://openshift-ssa.github.io/openshift-poc

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/openshift.png
  favicon: assets/images/openshift.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  - privacy:
      links_attr_map:
        target: _blank
  - macros:
      on_undefined: keep

extra:
  ocp_version: "4.22"
  ocp_release: "4.22.11"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - mdx_truly_sane_lists

nav:
  - Home:
      - home/index.md
      - Architecture: home/architecture.md
  - Prerequisites:
      - prerequisites/index.md
      - POC Checklist: prerequisites/poc-checklist.md
      - Infrastructure: prerequisites/infrastructure.md
      - Networking: prerequisites/networking.md
      - DNS: prerequisites/dns.md
      - Storage: prerequisites/storage.md
      - Installation Host: prerequisites/installation-host.md
  - Install the Cluster:
      - install-the-cluster/index.md
      - Assisted Installer: install-the-cluster/assisted-installer.md
      - Agent-Based Installer: install-the-cluster/agent-based.md
      - Troubleshooting: install-the-cluster/troubleshooting.md
      - Other Installation Methods:
          - install-the-cluster/other-installation-methods/index.md
          - Hub and Spoke: install-the-cluster/other-installation-methods/hub-and-spoke.md
          - VMware vSphere IPI: install-the-cluster/other-installation-methods/vmware-install.md
          - OpenShift on OpenShift: install-the-cluster/other-installation-methods/openshift-on-openshift.md
          - Disconnected: install-the-cluster/other-installation-methods/disconnected.md
  - Configure the Cluster:
      - configure-the-cluster/index.md
      - Required:
          - configure-the-cluster/required/index.md
          - NMState Operator: configure-the-cluster/required/nmstate.md
          - Storage:
              - configure-the-cluster/required/storage/index.md
              - OpenShift Data Foundation: configure-the-cluster/required/storage/odf.md
              - NetApp Trident: configure-the-cluster/required/storage/netapp-trident.md
              - Dell Unity XT (iSCSI): configure-the-cluster/required/storage/dell/dell-unity.md
              - VMware vSphere CSI: configure-the-cluster/required/storage/vsphere-csi.md
          - Registry: configure-the-cluster/required/registry.md
      - Workload Availability:
          - configure-the-cluster/workload-availability/index.md
          - Descheduler & Affinity: configure-the-cluster/workload-availability/workload-availability.md
          - OADP (Backup & Restore): configure-the-cluster/workload-availability/oadp.md
      - Virtualization & Migration:
          - configure-the-cluster/virtualization-and-migration/index.md
          - OpenShift Virtualization: configure-the-cluster/virtualization-and-migration/virtualization.md
          - Migration Toolkit for Virtualization: configure-the-cluster/virtualization-and-migration/mtv.md
      - Observability:
          - configure-the-cluster/observability/index.md
          - Logging: configure-the-cluster/observability/logging.md
          - Network Observability: configure-the-cluster/observability/network-observability.md
          - MultiCluster Observability: configure-the-cluster/observability/multicluster-observability.md
      - Optional:
          - configure-the-cluster/optional/index.md
          - Identity Providers: configure-the-cluster/optional/configuring-identity-providers.md
          - Networking: configure-the-cluster/optional/networking.md
          - OpenShift GitOps: configure-the-cluster/optional/openshift-gitops.md
          - External Secrets Operator: configure-the-cluster/optional/external-secrets-operator.md
          - Service Mesh: configure-the-cluster/optional/service-mesh.md
          - Web Terminal: configure-the-cluster/optional/web-terminal.md
          - Operators from Artifactory: configure-the-cluster/optional/operators-from-artifactory.md
          - POC Banner: configure-the-cluster/optional/poc-banner.md
  - Workloads and Operations:
      - workloads-and-operations/index.md
      - Container Workloads:
          - workloads-and-operations/container-workloads/index.md
          - Hello World Web Server: workloads-and-operations/container-workloads/hello-world-web-server.md
          - Spring PetClinic: workloads-and-operations/container-workloads/spring-petclinic.md
          - Kafka (Strimzi): workloads-and-operations/container-workloads/kafka-strimzi.md
          - Source-to-Image (S2I) Build: workloads-and-operations/container-workloads/s2i-build.md
          - PostgreSQL with Persistent Storage: workloads-and-operations/container-workloads/postgresql.md
          - PVC Read-Back Test: workloads-and-operations/container-workloads/pvc-readback.md
          - Bookinfo (Service Mesh): workloads-and-operations/container-workloads/bookinfo.md
      - Virtual Machine Workloads:
          - workloads-and-operations/virtual-machine-workloads/index.md
          - RHEL VM with Apache httpd: workloads-and-operations/virtual-machine-workloads/rhel-httpd-vm.md
          - Virtual Appliances (OVA): workloads-and-operations/virtual-machine-workloads/ova-virtual-appliance.md
      - Operational Validation:
          - workloads-and-operations/operational-validation/index.md
