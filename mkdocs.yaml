site_name: OpenShift POC
site_description: Prerequisites and installation instructions for OpenShift on-premise environments
site_url: https://openshift-ssa.github.io/openshift-poc

theme:
  name: material
  logo: assets/images/openshift.png
  favicon: assets/images/openshift.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  - privacy:
      links_attr_map:
        target: _blank
  - macros:
      on_undefined: keep

extra:
  ocp_version: "4.21"
  ocp_release: "4.21.0"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - mdx_truly_sane_lists

nav:
  - Home:
      - Overview: home/index.md
      - Architecture: home/architecture.md
  - Prerequisites:
      - Overview: prerequisites/index.md
      - POC Checklist: prerequisites/poc-checklist.md
      - Infrastructure: prerequisites/infrastructure.md
      - Networking: prerequisites/networking.md
      - DNS: prerequisites/dns.md
      - Storage: prerequisites/storage.md
      - Installation Host: prerequisites/installation-host.md
  - Install the Cluster:
      - Overview: installation/index.md
      - Assisted Installer: installation/assisted-installer.md
      - Agent-Based Installer: installation/agent-based.md
      - Disconnected Environments:
          - Mirror Registry (oc-mirror): installation/disconnected/oc-mirror.md
          - Pull-Through Cache: installation/disconnected/pull-through-cache.md
          - OpenShift Configuration: installation/disconnected/openshift-config.md
      - Other Methods:
          - Overview: installation/other/index.md
          - VMware vSphere IPI: installation/other/vmware-install.md
          - OpenShift on OpenShift: installation/other/openshift-on-openshift.md
          - Fleet Management:
              - Overview: installation/other/fleet-management/index.md
              - Hub Install (SNO): installation/other/fleet-management/sno-hub.md
              - Hub Storage: installation/other/fleet-management/hub-storage.md
              - Advanced Cluster Management: installation/other/fleet-management/acm-install.md
              - Provision Bare Metal Cluster: installation/other/fleet-management/acm-provision-bare-metal-cluster.md
      - Troubleshooting: installation/troubleshooting.md
  - Configure the Cluster:
      - Overview: post-installation/index.md
      - Required:
          - NMState Operator: post-installation/nmstate.md
          - Storage:
              - Overview: post-installation/storage/index.md
              - OpenShift Data Foundation: post-installation/storage/odf.md
              - NetApp Trident: post-installation/storage/netapp-trident.md
              - Dell Unity XT (iSCSI): post-installation/storage/dell/dell-unity.md
              - VMware vSphere CSI: post-installation/storage/vsphere-csi.md
          - Registry: post-installation/registry.md
          - Identity Providers: post-installation/configuring-identity-providers.md
      - Observability:
          - Logging: post-installation/logging.md
          - Network Observability: post-installation/network-observability.md
          - MultiCluster Observability: post-installation/multicluster-observability.md
      - Virtualization & Migration:
          - OpenShift Virtualization: post-installation/virtualization.md
          - Migration Toolkit for Virtualization: post-installation/mtv.md
      - Workload Availability:
          - Descheduler & Affinity: post-installation/workload-availability.md
          - OADP (Backup & Restore): post-installation/oadp.md
      - Optional:
          - Networking: post-installation/networking.md
          - OpenShift GitOps: post-installation/openshift-gitops.md
          - External Secrets Operator: post-installation/external-secrets-operator.md
          - Service Mesh: post-installation/service-mesh.md
          - Web Terminal: post-installation/web-terminal.md
          - Operators from Artifactory: post-installation/operators-from-artifactory.md
          - POC Banner: post-installation/poc-banner.md
  - Validate the POC:
      - Overview: workloads/index.md
      - Container Workloads:
          - Overview: workloads/workload-containers.md
          - Hello World Web Server: workloads/busybox-hello-world.md
          - Spring PetClinic: workloads/spring-petclinic.md
          - Kafka (Strimzi): workloads/kafka-strimzi.md
          - Source-to-Image (S2I) Build: workloads/s2i-build.md
          - PostgreSQL with Persistent Storage: workloads/postgresql.md
          - PVC Read-Back Test: workloads/pvc-readback.md
          - Bookinfo (Service Mesh): workloads/bookinfo.md
      - Virtual Machine Workloads:
          - Deploying Virtual Machines: workloads/workload-virtual-machines.md
      - Operational Validation:
          - VM Failover Test: operations/vm-failover.md
          - Container Failover Test: operations/container-failover.md
          - VM Backup and Restore: operations/vm-backup-restore.md
      - Day-2 Operations:
          - Overview: operations/index.md
          - Add Worker Node: operations/add-worker-node.md
          - Rotate SSH Keys: operations/rotate-ssh-keys.md
          - Machine Config: operations/machine-config.md
          - Debugging MTU Mismatches: operations/debug-mtu.md
